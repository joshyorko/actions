[tool.poetry]
name = "actions-local-devutils"
version = "0.0.1"
description = "Utilities for development in monorepo."
authors = [
	"Fabio Z. <fabio@robocorp.com>",
	"Cosmin P. <cosmin@robocorp.com>",
	"Ovidiu R. <ovidiu@robocorp.com>",
]
readme = "README.md"
packages = [{include = "devutils", from="src"}]

[tool.poetry.dependencies]
python = "^3.8"
ruff = "^0.1.14"
mypy = "^1.1.1"
pytest = "^8.0"
pytest-xdist = "^3.2.1"
pytest-regressions = "1.0.6"
pydocstyle = "6.3.0"
isort = { version = "^5.12.0", python = "^3.8" }
types-invoke = "^2.0"
invoke = "^2.2.0"  # keep in sync with requirements.txt
mdformat-gfm = [
    { version = "0.3.6", python = ">=3.8,<3.10" },
    { version = "1.0.0", python = ">=3.10" },
]
tomlkit = "^0.11.8"  # keep in sync with requirements.txt
semver = "^3.0.0"  # keep in sync with requirements.txt
pylint = "^2.17.4"

[tool.poetry.group.dev.dependencies]
pytest-cov = "5.0.0"

[tool.poetry.group.sbom]
optional = true

[tool.poetry.group.sbom.dependencies]
cyclonedx-bom = { version = "7.5.0", python = ">=3.9,<4" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
