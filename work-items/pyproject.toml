[tool.poetry]
name = "actions-work-items"
version = "0.2.4"
description = "Drop-in replacement for robocorp-workitems with broader applicability"
authors = ["Community Contributors"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/joshyorko/actions/tree/community"
repository = "https://github.com/joshyorko/actions/tree/community"
keywords = ["automation", "work-items", "producer-consumer", "rpa", "workflow"]
packages = [
    {include = "actions", from = "src"},
    {include = "actions_work_items", from = "src"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
redis = {version = ">=4.5.0", optional = true}
pymongo = {version = ">=4.3.0", optional = true}

[tool.poetry.extras]
redis = ["redis"]
docdb = ["pymongo"]
documentdb = ["pymongo"]
all = ["redis", "pymongo"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21"
ruff = "^0.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
