[project]
name = "actions-work-items"
version = "0.3.1"
description = "Drop-in replacement for robocorp-workitems with broader applicability"
authors = [{name = "Community Contributors"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["automation", "work-items", "producer-consumer", "rpa", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/joshyorko/actions"
Repository = "https://github.com/joshyorko/actions"
Documentation = "https://github.com/joshyorko/actions/tree/community/work-items"
Issues = "https://github.com/joshyorko/actions/issues"

[project.optional-dependencies]
redis = ["redis>=4.5.0"]
docdb = ["pymongo>=4.3.0"]
documentdb = ["pymongo>=4.3.0"]
all = ["redis>=4.5.0", "pymongo>=4.3.0"]

[tool.poetry]
packages = [
    {include = "actions", from = "src"},
    {include = "actions_work_items", from = "src"},
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21"
ruff = "^0.12.0"
twine = "^6.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "redis: contract requiring the Redis backend",
    "integration: backend integration contract",
    "docdb: contract requiring MongoDB or DocumentDB",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
