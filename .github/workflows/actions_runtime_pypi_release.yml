name: Actions Runtime PYPI Release
permissions:
  contents: read
'on':
  push:
    tags:
    - actions-runtime-*
  pull_request:
    branches:
    - community
    paths:
    - .github/workflows/_gen_workflows.py
    - .github/workflows/actions_runtime_pypi_release.yml
    - .github/workflows/actions_runtime_binary_release.yml
    - .github/workflows/actions_runtime_manylinux_release.yml
    - devutils/tests/test_actions_runtime_release_line.py
    - devutils/tests/test_runtime_release_workflows.py
    - docs/skills/repository-operations.md
    - action_server/scripts/publish_verified_runtime.py
defaults:
  run:
    working-directory: ./action_server
jobs:
  build-sdist:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        name:
        - ubuntu-py3.12
        include:
        - name: ubuntu-py3.12
          python: '3.12'
          os: ubuntu-22.04
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.x
    - name: Check tag version
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv check-tag-version
      if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
      if: github.event_name == 'push'
    - name: Build frontend (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      if: github.event_name == 'pull_request'
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_GHA_TO_ANOTHER_REPO }}
      if: github.event_name == 'push'
    - name: Build OAuth2 config (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      if: github.event_name == 'pull_request'
    - name: Build sdist
      run: '

        # Make sure that we have no binaries present when doing the build.

        rm src/actions/server/bin/rcc* -f

        # Wheels are built in the matrix job.

        uv run --no-project --python ${{ matrix.python }} poetry build -f sdist

        '
      env:
        CI: true
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: true
    - name: 'Upload artifact: action_server/dist/*'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: action-server-dist
        path: action_server/dist/*
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-22.04
        - windows-2022
        - macos-15
        include:
        - os: ubuntu-22.04
          python: '3.12'
          name: ubuntu
        - os: windows-2022
          python: '3.12'
          name: windows
        - os: macos-15
          python: '3.12'
          name: macos
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.x
    - name: Check tag version
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv check-tag-version
      if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
      if: github.event_name == 'push'
    - name: Build frontend (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      if: github.event_name == 'pull_request'
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_GHA_TO_ANOTHER_REPO }}
      if: github.event_name == 'push'
    - name: Build OAuth2 config (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      if: github.event_name == 'pull_request'
    - name: Install devutils requirements
      run: 'uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt

        uv run --no-project --python ${{ matrix.python }}  python -m pip install --break-system-packages
        cibuildwheel==2.23.1'
    - name: Set macOS deployment target
      if: ${{ matrix.name == 'macos' }}
      run: echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"
    - name: Build candidate Core wheel for PR compatibility tests
      if: github.event_name == 'pull_request'
      working-directory: actions
      run: uv run --no-project --python ${{ matrix.python }} poetry build -f wheel
        -o ../action_server/candidate-core-wheelhouse
    - name: Build and clean-test wheels
      run: uv run --no-project --python ${{ matrix.python }} python -m cibuildwheel
        --output-dir wheelhouse
      env:
        CIBW_SKIP: pp*
        CIBW_BUILD: cp312-*macos*arm64 cp313-*macos*arm64 cp312-*manylinux*x86_64
          cp313-*manylinux*x86_64 cp312-*win*amd64 cp313-*win*amd64
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_TEST: ${{ github.event_name == 'pull_request' && 'python {project}/scripts/install_candidate_core.py
          {project}/candidate-core-wheelhouse' || '' }}
        CIBW_TEST_COMMAND: python -m pip check && python -m actions.server version
    - name: 'Upload artifact: action_server/wheelhouse/*'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ runner.os }}-wheels
        path: action_server/wheelhouse/*
  publish:
    needs:
    - build-sdist
    - build-wheels
    permissions:
      contents: read
    environment: pypi
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        python:
        - '3.12'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
      working-directory: action_server
    - name: Verify merged tag provenance and version
      if: github.event_name == 'push'
      run: "set -Eeuo pipefail\ngit fetch origin community:refs/remotes/origin/community\n\
        tag_commit=$(git rev-parse \"$GITHUB_REF^{commit}\")\nevent_commit=$(git rev-parse\
        \ \"$GITHUB_SHA^{commit}\")\ntest \"$tag_commit\" = \"$event_commit\"\ngit\
        \ merge-base --is-ancestor \"$GITHUB_SHA\" origin/community\ntag_version=${GITHUB_REF_NAME#actions-runtime-}\n\
        cd action_server\npackage_version=$(uv run --no-project --python 3.12 poetry\
        \ version --short)\nif [[ \"$tag_version\" != \"$package_version\" ]]; then\n\
        \  printf 'tag version %s does not match package version %s\\n'     \"$tag_version\"\
        \ \"$package_version\" >&2\n  exit 1\nfi\n"
    - name: Download sdist artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: action-server-dist
        path: action_server/dist/downloads/sdist
    - name: Download wheel artifacts separately
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: '*-wheels'
        path: action_server/dist/downloads/wheels
        merge-multiple: false
    - name: Verify exact Runtime artifact inventory
      run: 'set -Eeuo pipefail

        cd action_server

        rm -rf actions-runtime-dist

        uv run --no-project --python ${{ matrix.python }} python scripts/publish_verified_runtime.py
        --download-root dist/downloads --dry-run

        rm -rf dist

        mv actions-runtime-dist dist

        '
    - name: Install Twine 6.2.0
      run: uv run --no-project --python ${{ matrix.python }} python -m pip install
        --break-system-packages twine==6.2.0
    - name: Verify Runtime artifacts
      run: uv run --no-project --python ${{ matrix.python }} twine check --strict
        action_server/dist/*.whl action_server/dist/*.tar.gz
    - name: Canary local Runtime verifier
      run: uv run --no-project --python ${{ matrix.python }} python action_server/scripts/publish_verified_runtime.py
        --dist-dir action_server/dist --dry-run
    - name: 'Upload artifact: action_server/dist/*'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: actions-runtime-dist
        path: action_server/dist/*
    - name: Check Runtime publish credential
      id: runtime-token
      if: github.event_name == 'push'
      env:
        RUNTIME_TOKEN: ${{ secrets.PYPI_TOKEN_ACTIONS_RUNTIME }}
      run: "set -Eeuo pipefail\nif [[ -z \"${RUNTIME_TOKEN:-}\" ]]; then\n  echo \"\
        PYPI_TOKEN_ACTIONS_RUNTIME is required for a tagged Actions Runtime release\"\
        \ >&2\n  exit 1\nfi\necho 'enabled=true' >> \"$GITHUB_OUTPUT\""
    - name: Publish verified artifacts
      if: github.event_name == 'push' && steps.runtime-token.outputs.enabled == 'true'
      run: uv run --no-project --python ${{ matrix.python }} twine upload action_server/dist/*.whl
        action_server/dist/*.tar.gz
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets[format('PYPI_TOKEN_{0}', 'ACTIONS_RUNTIME')] }}


