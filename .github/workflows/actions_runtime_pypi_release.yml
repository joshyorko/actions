name: Actions Runtime PYPI Release
permissions:
  contents: read
'on':
  push:
    tags:
    - actions-runtime-*
  pull_request:
    branches:
    - community
    - integration/**
    paths:
    - .gitattributes
    - .github/workflows/_gen_workflows.py
    - .github/workflows/actions_runtime_pypi_release.yml
    - .github/workflows/actions_runtime_binary_release.yml
    - .github/workflows/actions_runtime_manylinux_release.yml
    - devutils/tests/test_actions_runtime_release_line.py
    - devutils/tests/test_runtime_release_workflows.py
    - docs/skills/repository-operations.md
    - action_server/scripts/publish_verified_runtime.py
    - action_server/scripts/runtime_release_button.py
    - action_server/scripts/write_runtime_build_source.py
    - .github/workflows/runtime-release-prepare.yml
    - .github/workflows/runtime-release-publish.yml
    - devutils/tests/test_runtime_release_button.py
    - action_server/scripts/verify_published_runtime_floor.py
    - devutils/tests/test_runtime_registry_floor_canary.py
    - devutils/tests/test_candidate_core_wheel.py
defaults:
  run:
    working-directory: ./action_server
jobs:
  build-sdist:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        name:
        - ubuntu-py3.12
        include:
        - name: ubuntu-py3.12
          python: '3.12'
          os: ubuntu-22.04
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      env:
        GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
        GIT_CONFIG_KEY_0: core.longpaths
        GIT_CONFIG_VALUE_0: 'true'
    - name: Verify macOS26 ARM runner
      if: runner.os == 'macOS'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: 'set -Eeuo pipefail

        test "$RUNNER_ARCH" = ARM64

        test "$(uname -m)" = arm64

        version=$(sw_vers -productVersion)

        [[ "$version" == 26.* ]]

        printf ''macos-26: architecture=%s os_version=%s\n'' "$(uname -m)" "$version"

        '
    - name: Verify native Linux ARM64 runner
      if: matrix.os == 'ubuntu-24.04-arm'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: 'set -euo pipefail

        test "$RUNNER_OS" = Linux

        test "$RUNNER_ARCH" = ARM64

        test "$(uname -m)" = aarch64

        df -h "$HOME" /tmp

        test "$(df -Pk "$HOME" | awk ''NR == 2 { print $4 }'')" -ge 20971520

        '
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
        version: ${{ matrix.os == 'ubuntu-24.04-arm' && '0.9.26' || '' }}
    - name: Install Python 3.12
      run: uv python install 3.12
      if: matrix.os != 'ubuntu-24.04-arm'
    - name: Set up pinned ARM64 Python
      if: matrix.os == 'ubuntu-24.04-arm'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.15
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.os == 'ubuntu-24.04-arm' && '20.19.3' || '20.x' }}
    - name: Check tag version
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv check-tag-version
      if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
      if: github.event_name == 'push'
    - name: Build frontend (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      if: github.event_name == 'pull_request'
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env: {}
      if: github.event_name == 'push'
    - name: Build OAuth2 config (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      if: github.event_name == 'pull_request'
      env: {}
    - name: Build sdist
      run: '

        # Make sure that we have no binaries present when doing the build.

        rm src/actions/server/bin/rcc* -f

        # Wheels are built in the matrix job.

        uv run --no-project --python ${{ matrix.python }} poetry build -f sdist

        '
      env:
        CI: true
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: true
    - name: 'Upload artifact: action_server/dist/*'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: action-server-dist
        path: action_server/dist/*
    - name: Bind distribution bytes to producer checkout
      run: uv run --no-project --python ${{ matrix.python }} python scripts/write_runtime_build_source.py
        dist
    - name: 'Upload artifact: action_server/runtime-build-source.json'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-build-source-sdist
        path: action_server/runtime-build-source.json
  build-wheels:
    timeout-minutes: 75
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-22.04
        - windows-2022
        - macos-26
        - ubuntu-24.04-arm
        include:
        - os: ubuntu-22.04
          python: '3.12'
          name: ubuntu
        - os: windows-2022
          python: '3.12'
          name: windows
        - os: macos-26
          python: '3.12'
          name: macos
        - os: ubuntu-24.04-arm
          python: 3.12.15
          name: linux-arm64
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      env:
        GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
        GIT_CONFIG_KEY_0: core.longpaths
        GIT_CONFIG_VALUE_0: 'true'
    - name: Verify macOS26 ARM runner
      if: runner.os == 'macOS'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: 'set -Eeuo pipefail

        test "$RUNNER_ARCH" = ARM64

        test "$(uname -m)" = arm64

        version=$(sw_vers -productVersion)

        [[ "$version" == 26.* ]]

        printf ''macos-26: architecture=%s os_version=%s\n'' "$(uname -m)" "$version"

