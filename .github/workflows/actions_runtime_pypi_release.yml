    - name: Verify native Linux ARM64 runner
      if: matrix.os == 'ubuntu-24.04-arm'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: 'set -euo pipefail

        test "$RUNNER_OS" = Linux

        test "$RUNNER_ARCH" = ARM64

        test "$(uname -m)" = aarch64

        df -h "$HOME" /tmp

        test "$(df -Pk "$HOME" | awk ''NR == 2 { print $4 }'')" -ge 20971520

        '
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
        version: ${{ matrix.os == 'ubuntu-24.04-arm' && '0.9.26' || '' }}
    - name: Install Python 3.12
      run: uv python install 3.12
      if: matrix.os != 'ubuntu-24.04-arm'
    - name: Set up pinned ARM64 Python
      if: matrix.os == 'ubuntu-24.04-arm'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.15
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
      env:
