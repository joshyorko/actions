    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: 'true'
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.os == 'ubuntu-24.04-arm' && '20.19.3' || '20.x' }}
    - name: Check tag version
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv check-tag-version
      if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
      if: github.event_name == 'push'
    - name: Build frontend (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      if: github.event_name == 'pull_request'
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env: {}
      if: github.event_name == 'push'
    - name: Build OAuth2 config (PR)
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      if: github.event_name == 'pull_request'
      env: {}
    - name: Install devutils requirements
      run: 'uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt

        uv run --no-project --python ${{ matrix.python }}  python -m pip install --break-system-packages
        cibuildwheel==2.23.4'
    - name: Set macOS deployment target
      if: ${{ matrix.name == 'macos' }}
      run: echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"
    - name: Build candidate Core wheel for PR compatibility tests
      if: github.event_name == 'pull_request'
      working-directory: actions
      run: uv run --no-project --python ${{ matrix.python }} poetry build -f wheel
        -o ../action_server/candidate-core-wheelhouse
    - name: Build candidate HTTP Helper wheel for PR compatibility tests
      if: github.event_name == 'pull_request'
      working-directory: actions-http-helper
      run: uv run --no-project --python ${{ matrix.python }} poetry build -f wheel
        -o ../action_server/candidate-helper-wheelhouse
    - name: Build candidate Work Items SDK wheel for PR compatibility tests
      if: github.event_name == 'pull_request'
      working-directory: work-items
      run: uv run --no-project --python ${{ matrix.python }} poetry build -f wheel
        -o ../action_server/candidate-sdk-wheelhouse
    - name: Bind candidate Core wheel to producer checkout
      if: github.event_name == 'pull_request'
      run: uv run --no-project --python ${{ matrix.python }} python scripts/write_candidate_sdk_producer.py
        candidate-core-wheelhouse --distribution actions-core
    - name: Bind candidate SDK wheel to producer checkout
      if: github.event_name == 'pull_request'
      run: uv run --no-project --python ${{ matrix.python }} python scripts/write_candidate_sdk_producer.py
        candidate-sdk-wheelhouse
    - name: Build and clean-test wheels
      run: uv run --no-project --python ${{ matrix.python }} python -m cibuildwheel
        --output-dir wheelhouse
      env:
        CIBW_SKIP: pp*
        CIBW_BUILD: cp312-*macos*arm64 cp313-*macos*arm64 cp312-*manylinux*x86_64
          cp313-*manylinux*x86_64 cp312-*win*amd64 cp313-*win*amd64 cp312-*manylinux*aarch64
          cp313-*manylinux*aarch64
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ARCHS_LINUX: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'auto'
          }}
        CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux2014_aarch64@sha256:31b71c1b6b52aa1369d6aa632fcaad2874a93620556dfb6f99344620e6ccb37b
        CIBW_ENVIRONMENT: ACTIONS_CANDIDATE_SOURCE_SHA=${{ github.sha }}
        CIBW_BEFORE_TEST: ${{ github.event_name == 'pull_request' && 'python {project}/scripts/install_candidate_core.py
          {project}/candidate-core-wheelhouse {project}/candidate-helper-wheelhouse
          {project}/candidate-sdk-wheelhouse' || '' }}
        CIBW_TEST_COMMAND: python "{project}/scripts/verify_published_runtime_floor.py"
          --installed-wheel "{wheel}" --checkout-root "{project}" ${{ github.event_name
          == 'pull_request' && '--candidate-sdk-wheelhouse {project}/candidate-sdk-wheelhouse
          --candidate-core-wheelhouse {project}/candidate-core-wheelhouse' || '' }}
    - name: Verify Runtime wheel with published Core and Helper
      if: github.event_name == 'pull_request'
      run: uv run --no-project --python ${{ matrix.python }} python scripts/verify_published_runtime_floor.py
        wheelhouse --candidate-sdk-wheelhouse candidate-sdk-wheelhouse --candidate-core-wheelhouse
        candidate-core-wheelhouse
    - name: Qualify selected ARM64 wheels in real RCC environments
      if: matrix.os == 'ubuntu-24.04-arm'
      timeout-minutes: 35
      run: 'uv run --no-project --python ${{ matrix.python }} poetry run python -c
        ''from actions.server._download_rcc import download_rcc; download_rcc()''

        uv run --no-project --python ${{ matrix.python }} poetry run python scripts/verify_linux_arm64_wheel.py
        --rcc-consumers wheelhouse . ${{ github.event_name != ''pull_request'' &&
        ''--published-dependencies'' || '''' }}

        uv run --no-project --python ${{ matrix.python }} poetry run python scripts/verify_linux_arm64_wheel.py
        --verify-evidence wheelhouse arm64-wheel-evidence'
    - name: Retain original ARM64 wheel consumer receipts
      if: always() && matrix.os == 'ubuntu-24.04-arm'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-arm64-wheel-acceptance
        path: action_server/arm64-wheel-evidence/
        if-no-files-found: error
        retention-days: 30
    - name: 'Upload artifact: action_server/wheelhouse/*'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.os == 'ubuntu-24.04-arm' && 'Linux-ARM64' || runner.os }}-wheels
        path: action_server/wheelhouse/*
    - name: Bind distribution bytes to producer checkout
      run: uv run --no-project --python ${{ matrix.python }} python scripts/write_runtime_build_source.py
        wheelhouse
    - name: 'Upload artifact: action_server/runtime-build-source.json'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-build-source-${{ matrix.os == 'ubuntu-24.04-arm' && 'Linux-ARM64'
          || runner.os }}
        path: action_server/runtime-build-source.json
  publish:
    needs:
    - build-sdist
    - build-wheels
    permissions:
      contents: read
    environment: pypi
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        python:
        - '3.12'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      env:
        GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
