name: Package credential availability

on:
  push:
    branches:
      - release/package-credential-availability-20261009
    paths:
      - .github/workflows/package_credential_availability.yml
      - docs/skills/repository-operations.md

permissions: {}

jobs:
  credential-availability:
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 2
    steps:
      - name: Check Core and Runtime credentials without publishing
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.PYPI_TOKEN_ACTIONS_CORE }}
          RUNTIME_TOKEN: ${{ secrets.PYPI_TOKEN_ACTIONS_RUNTIME }}
        run: |
          set +x
          set -euo pipefail

          core_state=empty
          runtime_state=empty
          missing=0
          if [[ -n "${CORE_TOKEN:-}" ]]; then
            core_state=nonempty
          else
            missing=1
          fi
          if [[ -n "${RUNTIME_TOKEN:-}" ]]; then
            runtime_state=nonempty
          else
            missing=1
          fi

          {
            printf 'Core PyPI credential: %s\n' "$core_state"
            printf 'Runtime PyPI credential: %s\n' "$runtime_state"
            printf 'Registry authentication and upload were not attempted.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Core PyPI credential: %s\n' "$core_state"
          printf 'Runtime PyPI credential: %s\n' "$runtime_state"
          if (( missing != 0 )); then
            printf 'One or more package credentials are unavailable.\n' >&2
            exit 1
          fi
          printf 'Registry authentication and upload were not attempted.\n'
