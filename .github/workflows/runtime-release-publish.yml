name: Publish Actions Runtime Release
run-name: ${{ inputs.operation }} Runtime ${{ inputs.expected_version }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate first; publish creates a tag and publishes packages/release
        required: true
        type: choice
        default: validate
        options: [validate, publish]
      preparation_run_id:
        description: Successful reviewed preparation run ID (never rerun preparation)
        required: true
        type: string
      source_sha:
        description: Exact source SHA recorded by that preparation
        required: true
        type: string
      expected_version:
        description: Exact stable version recorded by that preparation
        required: true
        type: string
      manifest_sha256:
        description: Independently reviewed SHA-256 of release-bundle.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-release-${{ inputs.expected_version }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'joshyorko/actions' && github.ref == 'refs/heads/community'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install twine==6.2.0 packaging==25.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-release-bundle-${{ inputs.preparation_run_id }}-1
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-release-bundle
      - name: Validate reviewed bundle and reconcile actual publication state
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.expected_version }}
          PREPARATION_RUN: ${{ inputs.preparation_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          python action_server/scripts/runtime_release_button.py validate
          --source-sha "$SOURCE_SHA" --version "$VERSION"
          --preparation-run-id "$PREPARATION_RUN" --manifest-sha256 "$MANIFEST_SHA256"
          --bundle "$RUNNER_TEMP/runtime-release-bundle"
  publish:
    if: inputs.operation == 'publish'
    needs: validate
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install twine==6.2.0 packaging==25.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-release-bundle-${{ inputs.preparation_run_id }}-1
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-release-bundle
      - name: Publish or safely resume the exact reviewed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TOKEN: ${{ secrets.PYPI_TOKEN_ACTIONS_RUNTIME }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.expected_version }}
          PREPARATION_RUN: ${{ inputs.preparation_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          python action_server/scripts/runtime_release_button.py publish
          --source-sha "$SOURCE_SHA" --version "$VERSION"
          --preparation-run-id "$PREPARATION_RUN" --manifest-sha256 "$MANIFEST_SHA256"
          --bundle "$RUNNER_TEMP/runtime-release-bundle"
