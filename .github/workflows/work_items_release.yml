name: Work Items Release

on:
  pull_request:
    paths:
      - "work-items/**"
      - "action_server/poetry.lock"
      - ".devcontainer/bin/verify-work-items"
      - ".devcontainer/tests/**"
      - ".github/workflows/work_items_release.yml"
      - "docs/skills/work-items.md"
  push:
    branches:
      - community
    tags:
      - "actions-work-items-*"
    paths:
      - "work-items/**"
      - "action_server/poetry.lock"
      - ".devcontainer/bin/verify-work-items"
      - ".devcontainer/tests/**"
      - ".github/workflows/work_items_release.yml"
      - "docs/skills/work-items.md"

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Synchronize Work Items dependencies
        run: poetry -C work-items sync --no-interaction

      - name: Verify release artifacts
        run: .devcontainer/bin/verify-work-items "$GITHUB_WORKSPACE/work-items/dist"

      - name: Upload verified Work Items artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-work-items-dist
          path: work-items/dist

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/actions-work-items-')
    permissions:
      contents: read
    environment: pypi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-items

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Synchronize Work Items dependencies
        run: poetry sync --no-interaction

      - name: Verify merged tag provenance
        run: |
          set -Eeuo pipefail
          git fetch origin community:refs/remotes/origin/community
          git merge-base --is-ancestor "$GITHUB_SHA" origin/community
          tag_version=${GITHUB_REF_NAME#actions-work-items-}
          package_version=$(poetry version --short)
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'tag version %s does not match package version %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi

      - name: Download verified Work Items artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: actions-work-items-dist
          path: work-items/dist

      - name: Publish verified artifacts
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN_ACTIONS_WORK_ITEMS }}
        run: poetry publish --no-interaction
