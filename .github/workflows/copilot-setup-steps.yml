name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/developer_toolkit.yml
      - developer/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/developer_toolkit.yml
      - developer/**

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Clone the repository to install dependencies
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Match the primary Linux asset in developer_toolkit.yml.
      - name: Install pinned Josh RCC
        shell: bash
        env:
          RCC_VERSION: 18.19.3
          RCC_SHA256: 7e588c01751ca2ae15ba13ef67f2f4b7567697a5a8389737059a73936f509428
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actions-rcc"
          curl --fail --location --silent --show-error \
            "https://github.com/joshyorko/rcc/releases/download/v${RCC_VERSION}/rcc-linux64" \
            --output "$RUNNER_TEMP/actions-rcc/rcc"
          printf '%s  %s\n' "$RCC_SHA256" "$RUNNER_TEMP/actions-rcc/rcc" | sha256sum --check --status -
          chmod +x "$RUNNER_TEMP/actions-rcc/rcc"
          echo "$RUNNER_TEMP/actions-rcc" >> "$GITHUB_PATH"
          echo "ROBOCORP_HOME=$RUNNER_TEMP/actions-robocorp" >> "$GITHUB_ENV"
          echo "ACTIONS_TOOLKIT_EXPECTED_RCC_VERSION=v${RCC_VERSION}" >> "$GITHUB_ENV"

      - name: Validate RCC manifest
        run: rcc robot diagnostics -r developer/toolkit.yaml --json

      - name: Run toolkit doctor
        run: rcc run -r developer/toolkit.yaml --dev -t Doctor

      - name: Bootstrap package environments
        run: rcc run -r developer/toolkit.yaml --dev -t Bootstrap

      - name: Verify isolated package environments
        shell: bash
        run: |
          set -euo pipefail
          for package in actions actions-http-helper devutils work-items action_server; do
            test -x "${package}/.venv/bin/python"
          done
          rcc run -r developer/toolkit.yaml --dev -t ToolkitTest
