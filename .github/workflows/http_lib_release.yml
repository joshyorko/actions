name: HTTP Helper Release

on:
  push:
    tags:
      - "actions_http-*"

permissions:
  contents: read

defaults:
  run:
    working-directory: "./actions-http-helper"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Install project
        run: poetry install --no-interaction

      - name: Check tag version
        run: poetry run invoke check-tag-version

      - name: Build verified HTTP helper artifacts
        run: poetry build

      - name: Verify exact HTTP helper artifact inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version=$(poetry version --short)
          tag_version=${GITHUB_REF_NAME#actions_http-}
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'tag version %s does not match package version %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi
          printf '%s\n' \
            "actions_http_helper-$package_version-py3-none-any.whl" \
            "actions_http_helper-$package_version.tar.gz" | sort > /tmp/http-helper-expected
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort \
            > /tmp/http-helper-actual
          diff -u /tmp/http-helper-expected /tmp/http-helper-actual
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "dist/actions_http_helper-$package_version-py3-none-any.whl"
          test ! -L "dist/actions_http_helper-$package_version-py3-none-any.whl"
          test -f "dist/actions_http_helper-$package_version.tar.gz"
          test ! -L "dist/actions_http_helper-$package_version.tar.gz"
          sha256sum dist/*.whl dist/*.tar.gz | sed 's#dist/##' | sort \
            > dist/actions-http-helper-manifest.sha256

      - name: Install Twine 6.2.0
        run: poetry run python -m pip install twine==6.2.0

      - name: Verify HTTP helper artifacts
        run: poetry run twine check --strict dist/*.whl dist/*.tar.gz

      - name: Upload verified HTTP helper artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-http-helper-dist
          path: actions-http-helper/dist

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/actions_http-')
    permissions:
      contents: read
    environment: pypi
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./actions-http-helper

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Verify merged tag provenance and version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin community:refs/remotes/origin/community
          git merge-base --is-ancestor "$GITHUB_SHA" origin/community
          tag_version=${GITHUB_REF_NAME#actions_http-}
          package_version=$(poetry version --short)
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'tag version %s does not match package version %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi

      - name: Download verified HTTP helper artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: actions-http-helper-dist
          path: actions-http-helper/dist

      - name: Verify downloaded HTTP helper artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version=$(poetry version --short)
          printf '%s\n' \
            "actions_http_helper-$package_version-py3-none-any.whl" \
            "actions_http_helper-$package_version.tar.gz" \
            "actions-http-helper-manifest.sha256" | sort > /tmp/http-helper-expected
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort \
            > /tmp/http-helper-actual
          diff -u /tmp/http-helper-expected /tmp/http-helper-actual
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -L dist/actions-http-helper-manifest.sha256
          (cd dist && sha256sum -c actions-http-helper-manifest.sha256)

      - name: Publish verified HTTP helper artifacts
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN_ACTIONS_HTTP_HELPER }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${POETRY_PYPI_TOKEN_PYPI:-}" ]]; then
            echo "PYPI_TOKEN_ACTIONS_HTTP_HELPER is required for a tagged HTTP helper release" >&2
            exit 1
          fi
          poetry publish --no-interaction
