name: Actions Runtime BINARY Release
permissions:
  contents: read
'on':
  push:
    tags:
    - actions-runtime-*
    branches:
    - '*-beta'
defaults:
  run:
    working-directory: ./action_server
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-22.04
        - windows-2022
        - macos-15
        include:
        - os: ubuntu-22.04
          python: '3.12'
          name: linux
          asset_path: action_server/dist/final/action-server
        - os: windows-2022
          python: '3.12'
          name: windows
          asset_path: action_server/dist/final/action-server.exe
        - os: macos-15
          python: '3.12'
          name: macos
          asset_path: action_server/dist/final/action-server
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.x
    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.23'
        cache-dependency-path: action_server/go-wrapper/go.sum
    - name: Check tag version
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv check-tag-version
      if: ${{ !endsWith(github.ref_name, '-beta') }}
    - name: Verify Runtime tag SHA and community ancestry
      shell: bash
      run: 'set -Eeuo pipefail

        git fetch origin community:refs/remotes/origin/community

        tag_commit=$(git rev-parse "$GITHUB_REF^{commit}")

        event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")

        test "$tag_commit" = "$event_commit"

        git merge-base --is-ancestor "$GITHUB_SHA" origin/community

        '
      if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_GHA_TO_ANOTHER_REPO }}
    - name: Check signing availability
      id: signing
      shell: bash
      env:
        RC_ACTION_SERVER_FORCE_DOWNLOAD_RCC: 'true'
        RC_ACTION_SERVER_DO_SELFTEST: 'true'
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT_ACTIONS_RUNTIME }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD_ACTIONS_RUNTIME
          }}
        MACOS_SIGNING_CERT_NAME: ${{ secrets.MACOS_SIGNING_CERT_NAME_ACTIONS_RUNTIME
          }}
        APPLEID: ${{ secrets.MACOS_APP_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLETEAMID: ${{ secrets.MACOS_TEAM_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLEIDPASS: ${{ secrets.MACOS_APP_ID_PASSWORD_ACTIONS_RUNTIME }}
        VAULT_URL: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_URL_ACTIONS_RUNTIME }}
        CLIENT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_ID_ACTIONS_RUNTIME
          }}
        TENANT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_TENANT_ID_ACTIONS_RUNTIME
          }}
        CLIENT_SECRET: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_SECRET_ACTIONS_RUNTIME
          }}
        CERTIFICATE_NAME: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CERTIFICATE_NAME_ACTIONS_RUNTIME
          }}
        SIGNING_EVENT: ${{ github.event_name }}
        SIGNING_OS: ${{ matrix.os }}
      run: "set -Eeuo pipefail\nsigned=false\ncase \"$SIGNING_OS\" in\n  macos-15)\
        \ keys=\"MACOS_SIGNING_CERT MACOS_SIGNING_CERT_PASSWORD MACOS_SIGNING_CERT_NAME\
        \ APPLEID APPLETEAMID APPLEIDPASS\" ;;\n  windows-2022) keys=\"VAULT_URL CLIENT_ID\
        \ TENANT_ID CLIENT_SECRET CERTIFICATE_NAME\" ;;\n  ubuntu-22.04) keys=\"\"\
        \ ;;\n  *) exit 1 ;;\nesac\npresent=0\nmissing=0\nfor key in $keys; do\n \
        \ if [[ -n \"${!key:-}\" ]]; then present=$((present + 1)); else missing=$((missing\
        \ + 1)); fi\ndone\nif (( present > 0 && missing > 0 )); then\n  echo \"partial\
        \ signing credentials configured\" >&2\n  exit 1\nfi\nif (( present > 0 ));\
        \ then signed=true; else echo \"all signing credentials absent; using unsigned\
        \ binary\"; fi\necho \"signed=$signed\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Build binary (signed)
      if: ${{ steps.signing.outputs.signed == 'true' }}
      env:
        RC_ACTION_SERVER_FORCE_DOWNLOAD_RCC: 'true'
        RC_ACTION_SERVER_DO_SELFTEST: 'true'
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT_ACTIONS_RUNTIME }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD_ACTIONS_RUNTIME
          }}
        MACOS_SIGNING_CERT_NAME: ${{ secrets.MACOS_SIGNING_CERT_NAME_ACTIONS_RUNTIME
          }}
        APPLEID: ${{ secrets.MACOS_APP_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLETEAMID: ${{ secrets.MACOS_TEAM_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLEIDPASS: ${{ secrets.MACOS_APP_ID_PASSWORD_ACTIONS_RUNTIME }}
        VAULT_URL: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_URL_ACTIONS_RUNTIME }}
        CLIENT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_ID_ACTIONS_RUNTIME
          }}
        TENANT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_TENANT_ID_ACTIONS_RUNTIME
          }}
        CLIENT_SECRET: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_SECRET_ACTIONS_RUNTIME
          }}
        CERTIFICATE_NAME: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CERTIFICATE_NAME_ACTIONS_RUNTIME
          }}
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv build-executable
        --sign --go-wrapper
    - name: Build binary (unsigned)
      if: ${{ steps.signing.outputs.signed != 'true' }}
      env:
        RC_ACTION_SERVER_FORCE_DOWNLOAD_RCC: 'true'
        RC_ACTION_SERVER_DO_SELFTEST: 'true'
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv build-executable
        --go-wrapper
    - name: 'Upload artifact: action_server/dist/final/'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: action-server-${{ matrix.os }}
        path: action_server/dist/final/
  release:
    if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-beta') }}
    permissions:
      contents: write
    needs:
    - build
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Create GitHub release
      uses: Roang-zero1/github-create-release-action@57eb9bdce7a964e48788b9e78b5ac766cb684803
      with:
        release_title: ${{ github.ref_name }}
        changelog_file: action_server/docs/ACTIONS_RUNTIME_CHANGELOG.md
        release_text: Actions Runtime binaries are available as assets. Run `action-server
          -h` for usage instructions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: action-server-windows-2022
        path: windows64/
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: action-server-macos-15
        path: macos-arm64/
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: action-server-ubuntu-22.04
        path: linux64/
    - name: Print contents
      run: "\n          pwd\n          ls -l\n          echo \"Windows64:\"\n    \
        \      cd windows64\n          ls -l\n          cd ../macos-arm64\n      \
        \    echo \"MacOS-arm64:\"\n          ls -l\n          cd ../linux64\n   \
        \       echo \"Linux64:\"\n          ls -l\n          cd ..\n          echo\
        \ \"GitHub ref: ${{ github.ref }}\"\n          "
    - name: Verify Runtime binary inventory
      shell: bash
      run: "set -Eeuo pipefail\nfor pair in   \"linux64/action-server linux64\"  \
        \ \"macos-arm64/action-server macos-arm64\"   \"windows64/action-server.exe\
        \ windows64\"; do\n  set -- $pair\n  binary=$1\n  directory=$2\n  test -f\
        \ \"$binary\"\n  test ! -L \"$binary\"\n  test \"$(find \"$directory\" -mindepth\
        \ 1 -maxdepth 1 | wc -l)\" -eq 1\ndone\ntag=\"$GITHUB_REF_NAME\"\n{\n  sha256sum\
        \ linux64/action-server | sed \"s#  linux64/action-server#  ${tag}-linux64#\"\
        \n  sha256sum macos-arm64/action-server | sed \"s#  macos-arm64/action-server#\
        \  ${tag}-macos-arm64#\"\n  sha256sum windows64/action-server.exe | sed \"\
        s#  windows64/action-server.exe#  ${tag}-windows64.exe#\"\n} | sort > \"${tag}-sha256.txt\"\
        \n"
    - name: Upload Linux binary
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./linux64/action-server
        asset_name: ${{ github.ref_name }}-linux64
        tag: ${{ github.ref }}
        overwrite: false
    - name: Upload MacOS arm binary
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./macos-arm64/action-server
        asset_name: ${{ github.ref_name }}-macos-arm64
        tag: ${{ github.ref }}
        overwrite: false
    - name: Upload Windows binary
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./windows64/action-server.exe
        asset_name: ${{ github.ref_name }}-windows64.exe
        tag: ${{ github.ref }}
        overwrite: false
    - name: Upload Runtime SHA-256 manifest
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./${{ github.ref_name }}-sha256.txt
        asset_name: ${{ github.ref_name }}-sha256.txt
        tag: ${{ github.ref }}
        overwrite: false


