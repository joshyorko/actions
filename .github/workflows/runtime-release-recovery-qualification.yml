name: Runtime release recovery qualification (no publication)
on:
  push:
    branches: [qualification/runtime-release-recovery-20261016]
permissions:
  contents: read
  actions: write
concurrency:
  group: runtime-release-recovery-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'joshyorko/actions' && github.ref == 'refs/heads/qualification/runtime-release-recovery-20261016'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing release verifier dependencies
        run: python -m pip install twine==6.2.0 packaging==25.0
      - name: Test destructive-target and uncertainty guards
        run: python scripts/test_qualify_runtime_release_recovery.py
      - name: Run only the explicit nonpublishing qualification request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/qualify_runtime_release_recovery.py
      - name: Retain qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-release-recovery-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-qualification-report.json
            scripts/disposable-preparation-proof.json
            scripts/disposable-release-bundle.json
            scripts/owner-release-bundle.json
          if-no-files-found: warn
          retention-days: 30
