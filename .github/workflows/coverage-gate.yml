name: Measured Python coverage gate

on:
  pull_request:
    branches: [community, integration/community-release-20261008]
  push:
    branches: [community]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-22.04
    env:
      ACTIONS_TOOLKIT_EXPECTED_RCC_VERSION: v18.19.3
    steps:
      - uses: actions/checkout@v4

      - name: Select task-local RCC and receipt directories
        shell: bash
        run: |
          echo "ROBOCORP_HOME=$RUNNER_TEMP/robocorp" >> "$GITHUB_ENV"
          echo "COVERAGE_OUTPUT_DIR=$RUNNER_TEMP/coverage-gate" >> "$GITHUB_ENV"

      - name: Cache RCC holotree
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/robocorp
          key: rcc-${{ runner.os }}-${{ runner.arch }}-coverage-v18.19.3-${{ hashFiles('developer/toolkit.yaml', 'developer/setup.yaml') }}

      - name: Install pinned RCC
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/joshyorko/rcc/releases/download/v18.19.3/rcc-linux64 \
            --output rcc.download
          printf '%s  %s\n' \
            7e588c01751ca2ae15ba13ef67f2f4b7567697a5a8389737059a73936f509428 \
            rcc.download | sha256sum --check --status -
          mv rcc.download rcc
          chmod +x rcc
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Check pinned toolchain
        run: rcc run -r developer/toolkit.yaml --dev -t Doctor

      - name: Bootstrap declared package environments
        run: rcc run -r developer/toolkit.yaml --dev -t Bootstrap

      - name: Run toolkit contracts
        run: rcc run -r developer/toolkit.yaml --dev -t ToolkitTest

      - name: Start owned PostgreSQL for portable Runtime tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image=postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          docker pull "$image"
          cid=$(docker run --detach --pull=never --rm \
            --name "actions-runtime-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --memory=3g --cpus=2 --pids-limit=256 \
            --tmpfs /var/lib/postgresql/data:size=2g \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_PASSWORD=synthetic-runtime-ci-only "$image")
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          echo "ACTIONS_RUNTIME_TEST_POSTGRES_CID=$cid" >> "$GITHUB_ENV"
          ready=false
          for attempt in {1..60}; do
            if docker exec "$cid" pg_isready -U postgres; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]]
          port=$(docker port "$cid" 5432/tcp)
          [[ "$port" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          url="postgresql://postgres:synthetic-runtime-ci-only@127.0.0.1:${BASH_REMATCH[1]}/postgres"
          echo "::add-mask::$url"
          echo "ACTIONS_INVOICE_TEST_POSTGRES=$url" >> "$GITHUB_ENV"
          echo "ACTIONS_TEST_POSTGRES_URL=$url" >> "$GITHUB_ENV"
          echo "ACTIONS_REQUIRE_INVOICE_PROVIDERS=1" >> "$GITHUB_ENV"

      - name: Measure portable package suite coverage
        run: rcc run -r developer/toolkit.yaml --dev -t Coverage

      - name: Remove owned portable-test PostgreSQL
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cid="${ACTIONS_RUNTIME_TEST_POSTGRES_CID:-}"
          if [[ -n "$cid" ]]; then
            [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
            docker rm --force "$cid"
            for attempt in {1..10}; do
              remaining=$(docker ps --all --no-trunc --quiet --filter "id=$cid")
              if [[ -z "$remaining" ]]; then break; fi
              sleep 1
            done
            [[ -z "$remaining" ]]
          fi
          echo "ACTIONS_INVOICE_TEST_POSTGRES=" >> "$GITHUB_ENV"
          echo "ACTIONS_TEST_POSTGRES_URL=" >> "$GITHUB_ENV"
          echo "ACTIONS_REQUIRE_INVOICE_PROVIDERS=0" >> "$GITHUB_ENV"

      - name: Upload coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-receipts
          path: ${{ runner.temp }}/coverage-gate/**/*.json
          if-no-files-found: error
