    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Initialize frozen acceptance evidence directory
      run: mkdir -p "$RUNNER_TEMP/frozen-catalog-evidence"
    - name: Fetch and hash-check the fixed native artifact
      id: artifact
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ARTIFACT_ID: '11662342341'
        EXPECTED_ARCHIVE_SHA256: 18acd5e0fee3c93aed5cdeee404557417cc1964c0c93b7950065a7add5325cf6
      run: "set -Eeuo pipefail\ngit merge-base --is-ancestor f7c6ed61f24fd9e98d1465c83042c5446466311b\
        \ HEAD\ntest \"$(git rev-parse f7c6ed61f24fd9e98d1465c83042c5446466311b^{tree})\"\
        \ = 6cb691b44666347f3e0de68c9830bd6824a4a0a0\nbuild_tree=\"$(curl --fail --silent\
        \ --show-error --location --header \"Authorization: Bearer $GITHUB_TOKEN\"\
        \ --header \"Accept: application/vnd.github+json\" \"$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/bf4f7dd180e3e408acff41fdb093b57eee8cc0f4\"\
        \ | jq -er .commit.tree.sha)\"\ntest \"$build_tree\" = \"$(git rev-parse f7c6ed61f24fd9e98d1465c83042c5446466311b^{tree})\"\
        \nprintf \"%s\\n\" \"$build_tree\" > \"$RUNNER_TEMP/frozen-catalog-native-build-source-tree.txt\"\
        \ntest \"$(git rev-parse HEAD:action_server/src/actions/server)\" = \"$(git\
        \ rev-parse f7c6ed61f24fd9e98d1465c83042c5446466311b:action_server/src/actions/server)\"\
        \ngit diff --quiet f7c6ed61f24fd9e98d1465c83042c5446466311b HEAD -- action_server/src/actions/server\n\
        archive=\"$RUNNER_TEMP/f7-native.zip\"\ncurl --fail --silent --show-error\
        \ --location \\\n  --header \"Authorization: Bearer $GITHUB_TOKEN\" \\\n \
        \ --header 'Accept: application/vnd.github+json' \\\n  \"$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip\"\
        \ \\\n  --output \"$archive\"\necho \"$EXPECTED_ARCHIVE_SHA256  $archive\"\
        \ | sha256sum --check --status\nmkdir -p \"$RUNNER_TEMP/f7-native-download\"\
        \nunzip -q \"$archive\" -d \"$RUNNER_TEMP/f7-native-download\""
    - name: Verify full package provenance and frozen executable
      id: frozen
      run: "set -Eeuo pipefail\nuv run --no-project --python 3.12 python scripts/verify_frozen_catalog_artifact.py\
        \ \\\n  --provenance-tar \"$RUNNER_TEMP/f7-native-download/native-artifact-provenance.tar\"\
        \ \\\n  --destination \"$RUNNER_TEMP/f7-native-package\" \\\n  --output \"\
        $RUNNER_TEMP/frozen-catalog-artifact-verification.json\""
    - name: Install checksum-pinned RCC
      id: rcc
      run: "set -Eeuo pipefail\ndestination=src/actions/server/bin/rcc-18.19.3\nmkdir\
        \ -p \"$(dirname \"$destination\")\"\ncurl --fail --silent --show-error --location\
        \ \\\n  https://github.com/joshyorko/rcc/releases/download/v18.19.3/rcc-linux64\
        \ \\\n  --output \"$destination\"\necho '7e588c01751ca2ae15ba13ef67f2f4b7567697a5a8389737059a73936f509428\
        \  '\"$destination\" | sha256sum --check --status\nchmod 755 \"$destination\"\
        \nsha256sum \"$destination\" > \"$RUNNER_TEMP/frozen-catalog-rcc-sha256.txt\"\
        \n\"$destination\" version | tee \"$RUNNER_TEMP/frozen-catalog-rcc-version.txt\""
    - name: Install Action Server test dependencies
      id: dependencies
      env:
        ACTION_SERVER_SKIP_DOWNLOAD_IN_BUILD: '1'
      run: uv run --no-project --python 3.12 --with poetry==2.1.1 --with invoke==2.2.0
        env -u VIRTUAL_ENV inv devinstall
    - name: Run frozen managed rollback acceptance
      id: acceptance
      shell: bash
      env:
        SEMA4AI_INTEGRATION_TEST_ACTION_SERVER_EXECUTABLE: ${{ runner.temp }}/f7-native-package/dist/action-server/action-server
        ACTIONS_HOME: ${{ runner.temp }}/frozen-actions-home
        ROBOTS_HOME: ${{ runner.temp }}/frozen-robots-home
        TMPDIR: ${{ runner.temp }}/frozen-tmp
      run: "set -Eeuo pipefail\nmkdir -p \"$ACTIONS_HOME\" \"$ROBOTS_HOME\" \"$TMPDIR\"\
        \nuv run --no-project --python 3.12 --with poetry==2.1.1 env -u VIRTUAL_ENV\
        \ poetry run python -c 'import pytest, sys; print(f\"pytest={pytest.__file__};\
        \ python={sys.executable}\")'\nset +e\nuv run --no-project --python 3.12 --with\
        \ poetry==2.1.1 env -u VIRTUAL_ENV poetry run python -m pytest -m integration_test\
        \ -n 0 -q -s \\\n  tests/action_server_tests/test_cli_mcp_catalog_rollback.py::test_duplicate_mcp_key_rejects_complete_cli_batch_and_preserves_last_good\
        \ \\\n  tests/action_server_tests/test_cli_live_reload_multi_package.py::test_failed_watched_reload_keeps_both_packages_and_recovers\
        \ \\\n  --junitxml=\"$RUNNER_TEMP/frozen-catalog-junit.xml\" 2>&1 | tee \"\
        $RUNNER_TEMP/frozen-catalog-test.log\"\ntest_status=${PIPESTATUS[0]}\nif [\
        \ \"$test_status\" -eq 0 ]; then uv run --no-project --python 3.12 python\
        \ scripts/verify_frozen_catalog_junit.py \\\n  \"$RUNNER_TEMP/frozen-catalog-junit.xml\"\
        \ \"$RUNNER_TEMP/frozen-catalog-junit-summary.json\" || test_status=$?; fi\n\
        exit \"$test_status\""
    - name: Write final sanitized evidence receipt
      if: always()
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        FROZEN_OUTCOME: ${{ steps.frozen.outcome }}
        RCC_OUTCOME: ${{ steps.rcc.outcome }}
        DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
      run: 'python - <<''PY''

        import json, os

        from pathlib import Path

        root = Path(os.environ["RUNNER_TEMP"])

        steps = {name: os.environ.get(name + "_OUTCOME", "not-run") for name in ("ARTIFACT",
        "FROZEN", "RCC", "DEPENDENCIES", "ACCEPTANCE")}

        receipt = {"candidate_sha": "f7c6ed61f24fd9e98d1465c83042c5446466311b", "candidate_tree":
        "6cb691b44666347f3e0de68c9830bd6824a4a0a0", "native_build_source_sha": "bf4f7dd180e3e408acff41fdb093b57eee8cc0f4",
        "native_build_source_tree": "6cb691b44666347f3e0de68c9830bd6824a4a0a0", "control_sha":
        os.environ["GITHUB_SHA"], "artifact_id": "11662342341", "artifact_sha256":
        "18acd5e0fee3c93aed5cdeee404557417cc1964c0c93b7950065a7add5325cf6", "step_outcomes":
        steps, "status": "PASS" if all(value == "success" for value in steps.values())
        else "FAIL_OR_NOT_RUN"}

        source_tree = root / "frozen-catalog-native-build-source-tree.txt"

        if source_tree.is_file(): receipt["native_build_source_tree_api_readback"]
        = source_tree.read_text(encoding="utf-8").strip()

        junit = root / "frozen-catalog-junit-summary.json"

        if junit.is_file(): receipt["junit"] = json.loads(junit.read_text(encoding="utf-8"))

        (root / "frozen-catalog-summary.json").write_text(json.dumps(receipt, indent=2)
        + "\n", encoding="utf-8")

        PY'
    - name: Upload frozen acceptance evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: frozen-catalog-rollback-${{ github.sha }}
        path: ${{ runner.temp }}/frozen-catalog-*
        if-no-files-found: warn
        retention-days: 30


