name: Prepare Actions Runtime Release
run-name: Prepare Runtime ${{ inputs.expected_version }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full merged community source SHA to release
        required: true
        type: string
      qualification_sha:
        description: Full qualified PR head SHA with the identical complete Git tree
        required: true
        type: string
      expected_version:
        description: Exact stable Runtime version already prepared in source (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-release-${{ inputs.expected_version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'joshyorko/actions' && github.ref == 'refs/heads/community'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the existing release verifier dependencies
        run: python -m pip install packaging==25.0
      - name: Require the credential-free native producer policy
        # Never substitute unsigned artifacts when the existing publisher has a signer.
        env:
          SIGN_MAC_CERT: ${{ secrets.MACOS_SIGNING_CERT_ACTIONS_RUNTIME }}
          SIGN_MAC_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD_ACTIONS_RUNTIME }}
          SIGN_MAC_NAME: ${{ secrets.MACOS_SIGNING_CERT_NAME_ACTIONS_RUNTIME }}
          SIGN_MAC_ID: ${{ secrets.MACOS_APP_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
          SIGN_MAC_TEAM: ${{ secrets.MACOS_TEAM_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
          SIGN_MAC_APP_PASSWORD: ${{ secrets.MACOS_APP_ID_PASSWORD_ACTIONS_RUNTIME }}
          SIGN_WIN_URL: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_URL_ACTIONS_RUNTIME }}
          SIGN_WIN_CLIENT: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_ID_ACTIONS_RUNTIME }}
          SIGN_WIN_TENANT: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_TENANT_ID_ACTIONS_RUNTIME }}
          SIGN_WIN_SECRET: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_SECRET_ACTIONS_RUNTIME }}
          SIGN_WIN_CERT: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CERTIFICATE_NAME_ACTIONS_RUNTIME }}
        run: |
          python - <<'PY'
          import os
          if any(value for key, value in os.environ.items() if key.startswith('SIGN_')):
              raise SystemExit('Signing credentials configured: unsigned preparation forbidden. Retain signing policy and prepare signed artifacts before publication.')
          print('All native signing credentials absent; qualified unsigned binaries admitted.')
          PY
      - name: Verify source, qualification jobs, and retained artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          VERSION: ${{ inputs.expected_version }}
        run: >-
          python action_server/scripts/runtime_release_button.py prepare
          --source-sha "$SOURCE_SHA" --qualification-sha "$QUALIFICATION_SHA"
          --version "$VERSION" --output "$RUNNER_TEMP/runtime-release-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-release-bundle-${{ github.run_id }}-1
          path: ${{ runner.temp }}/runtime-release-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Show the exact publication inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'runtime-release-bundle/release-bundle.json'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Prepared only; no publication.\n\n')
              for key, value in [('preparation_run_id', os.environ['GITHUB_RUN_ID']), ('source_sha', os.environ['SOURCE_SHA']), ('expected_version', os.environ['VERSION']), ('manifest_sha256', digest)]:
                  output.write(f'- `{key}`: `{value}`\n')
              output.write('\nIndependently review the bundle, then run **Publish Actions Runtime Release**, first with `operation=validate`. Josh alone selects `publish`. Preserve this preparation run; rerun publication only.\n')
          PY
