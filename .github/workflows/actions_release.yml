name: Actions Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable package tag to recover (never moved)
        required: true
        type: string
      source_sha:
        description: Full original tag source SHA already merged to community
        required: true
        type: string
  push:
    tags:
      - "actions-core-*"

permissions:
  contents: read

defaults:
  run:
    working-directory: "./actions"

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/community' && github.actor == 'joshyorko' && github.triggering_actor == 'joshyorko')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Verify exact merged release source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^actions-core-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin community:refs/remotes/origin/community
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_sha" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" origin/community
          python - "$GITHUB_WORKSPACE/actions/pyproject.toml" <<'PYCODE'
          import os, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          # Both supported interpreters can parse this package's version line.
          import re
          version = re.search(r'^version = "([^"\n]+)"$', text, re.M).group(1)
          assert os.environ['RELEASE_TAG'] == 'actions-core-' + version
          PYCODE

      - name: Select the declared package interpreter
        run: |
          poetry env use "$(command -v python)"
          poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 10)'

      - name: Synchronize Core dependencies
        run: poetry sync --no-interaction

      - name: Check tag version
        run: poetry run invoke check-tag-version

      - name: Build verified Core artifacts
        run: poetry build

      - name: Verify exact Core artifact inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version=$(poetry version --short)
          tag_version=${RELEASE_TAG#actions-core-}
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'tag version %s does not match package version %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi
          printf '%s\n' \
            "actions_core-$package_version-py3-none-any.whl" \
            "actions_core-$package_version.tar.gz" | sort > "$RUNNER_TEMP/core-expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort \
            > "$RUNNER_TEMP/core-actual"
          diff -u "$RUNNER_TEMP/core-expected" "$RUNNER_TEMP/core-actual"
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "dist/actions_core-$package_version-py3-none-any.whl"
          test ! -L "dist/actions_core-$package_version-py3-none-any.whl"
          test -f "dist/actions_core-$package_version.tar.gz"
          test ! -L "dist/actions_core-$package_version.tar.gz"
          sha256sum dist/*.whl dist/*.tar.gz | sed 's#dist/##' | sort \
            > dist/actions-core-manifest.sha256

      - name: Install Twine 6.2.0
        run: poetry run python -m pip install twine==6.2.0

      - name: Verify Core artifacts
        run: poetry run twine check --strict dist/*.whl dist/*.tar.gz

      - name: Verify clean installed Core wheel
        run: python scripts/verify_clean_wheel.py "$(find dist -maxdepth 1 -name 'actions_core-*.whl' -print -quit)"

      - name: Upload verified Core artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-core-dist
          path: actions/dist

  publish:
    needs: verify
    if: (startsWith(github.ref, 'refs/tags/actions-core-') || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/community' && github.actor == 'joshyorko' && github.triggering_actor == 'joshyorko'))
    permissions:
      contents: read
    environment: pypi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - name: Verify exact merged release source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^actions-core-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin community:refs/remotes/origin/community
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_sha" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" origin/community
          python - "$GITHUB_WORKSPACE/actions/pyproject.toml" <<'PYCODE'
          import os, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          # Both supported interpreters can parse this package's version line.
          import re
          version = re.search(r'^version = "([^"\n]+)"$', text, re.M).group(1)
          assert os.environ['RELEASE_TAG'] == 'actions-core-' + version
          PYCODE

      - name: Select the declared package interpreter
        run: |
          poetry env use "$(command -v python)"
          poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 10)'

      - name: Verify merged tag provenance
        run: |
          set -Eeuo pipefail
          git fetch origin community:refs/remotes/origin/community
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/community
          tag_version=${RELEASE_TAG#actions-core-}
          package_version=$(poetry version --short)
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'tag version %s does not match package version %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi

      - name: Download verified Core artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: actions-core-dist
          path: actions/dist

      - name: Verify downloaded Core artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version=$(poetry version --short)
          printf '%s\n' \
            "actions_core-$package_version-py3-none-any.whl" \
            "actions_core-$package_version.tar.gz" \
            "actions-core-manifest.sha256" | sort > "$RUNNER_TEMP/core-expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort \
            > "$RUNNER_TEMP/core-actual"
          diff -u "$RUNNER_TEMP/core-expected" "$RUNNER_TEMP/core-actual"
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -L dist/actions-core-manifest.sha256
          test ! -L "dist/actions_core-$package_version-py3-none-any.whl"
          test ! -L "dist/actions_core-$package_version.tar.gz"
          (cd dist && sha256sum -c actions-core-manifest.sha256)

      - name: Publish verified Core artifacts
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN_ACTIONS_CORE }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${POETRY_PYPI_TOKEN_PYPI:-}" ]]; then
            echo "PYPI_TOKEN_ACTIONS_CORE is required for a tagged Core release" >&2
            exit 1
          fi
          poetry publish --no-interaction
