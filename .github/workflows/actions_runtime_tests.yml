        test -x \"$CANVAS_PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH\"\nbrowser_sha256=\"\
        $(poetry_cmd run python -c 'import hashlib, os; from pathlib import Path;\
        \ print(hashlib.sha256(Path(os.environ[\"CANVAS_PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH\"\
        ]).read_bytes()).hexdigest())')\"\nbrowser_version=\"$(poetry_cmd run python\
        \ -c 'import os, subprocess; browser_version = subprocess.run([os.environ[\"\
        CANVAS_PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH\"], \"--version\"], check=True,\
        \ capture_output=True, text=True, timeout=10).stdout.strip(); assert browser_version,\
        \ \"Browser version is empty\"; print(browser_version)')\"\npoetry_cmd run\
