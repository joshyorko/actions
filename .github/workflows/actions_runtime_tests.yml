        ACTIONS_HOME: ${{ runner.temp }}/canvas-query-published-actions-${{ github.run_id
          }}-${{ github.run_attempt }}
        TMPDIR: ${{ runner.temp }}/canvas-query-published-tmp-${{ github.run_id }}-${{
          github.run_attempt }}
        UV_CACHE_DIR: ${{ runner.temp }}/canvas-query-published-uv-${{ github.run_id
          }}-${{ github.run_attempt }}
        CANVAS_TEMPLATE_PUBLISHED_RECEIPT_PATH: ${{ runner.temp }}/canvas-query-published-acceptance-${{
          github.run_id }}-${{ github.run_attempt }}/published-core-receipt.json
