name: Action Server Tests
permissions:
  contents: read
  id-token: write
'on':
  push:
    branches:
    - master
    - wip
    paths:
    - action_server/**
    - .github/workflows/actions_runtime_tests.yml
    - devutils/**
    - actions/**
    - actions-http-helper/**
    - work-items/**
  pull_request:
    branches:
    - master
    - community
    - integration/**
    paths:
    - action_server/**
    - .github/workflows/actions_runtime_tests.yml
    - devutils/**
    - actions/**
    - actions-http-helper/**
    - work-items/**
    - .gitattributes
defaults:
  run:
    working-directory: ./action_server
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name:
        - ubuntu-py3.12-devmode
        - windows-py3.12-devmode
        - macos-py3.12-devmode
        include:
        - name: ubuntu-py3.12-devmode
          python: '3.12'
          os: ubuntu-22.04
        - name: windows-py3.12-devmode
          python: '3.12'
          os: windows-2022
        - name: macos-py3.12-devmode
          os: macos-15
          python: '3.12'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install Python 3.12
      run: uv python install 3.12
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
    - name: Setup go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: action_server/go-wrapper/go.sum
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Build frontend
      run: uv run --no-project --python ${{ matrix.python }} inv build-frontend
      env:
        CI: true
    - name: Build OAuth2 config
      run: uv run --no-project --python ${{ matrix.python }} inv build-oauth2-config
      env: {}
    - name: Test Go wrapper child lifecycle
      working-directory: action_server/go-wrapper
      env:
        GOTOOLCHAIN: local
        GOPROXY: 'off'
      run: go test process.go process_test.go
    - name: Build binary
      shell: bash
      env:
        RC_ACTION_SERVER_FORCE_DOWNLOAD_RCC: 'true'
        RC_ACTION_SERVER_DO_SELFTEST: 'true'
        MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT_ACTIONS_RUNTIME }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD_ACTIONS_RUNTIME
          }}
        MACOS_SIGNING_CERT_NAME: ${{ secrets.MACOS_SIGNING_CERT_NAME_ACTIONS_RUNTIME
          }}
        APPLEID: ${{ secrets.MACOS_APP_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLETEAMID: ${{ secrets.MACOS_TEAM_ID_FOR_NOTARIZATION_ACTIONS_RUNTIME }}
        APPLEIDPASS: ${{ secrets.MACOS_APP_ID_PASSWORD_ACTIONS_RUNTIME }}
        VAULT_URL: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_URL_ACTIONS_RUNTIME }}
        CLIENT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_ID_ACTIONS_RUNTIME
          }}
        TENANT_ID: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_TENANT_ID_ACTIONS_RUNTIME
          }}
        CLIENT_SECRET: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CLIENT_SECRET_ACTIONS_RUNTIME
          }}
        CERTIFICATE_NAME: ${{ secrets.WIN_SIGN_AZURE_KEY_VAULT_CERTIFICATE_NAME_ACTIONS_RUNTIME
          }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: if [ -n "$MACOS_SIGNING_CERT" ] || [ -n "$VAULT_URL" ]; then uv run --no-project
        --python ${{ matrix.python }} poetry run inv build-executable --sign --go-wrapper;
        else uv run --no-project --python ${{ matrix.python }} poetry run inv build-executable
        --go-wrapper; fi
    - name: 'Upload artifact: action_server/dist/final/'
      uses: actions/upload-artifact@v4
      with:
        name: action-server-${{ matrix.os }}
        path: action_server/dist/final/
    - name: Test (not integration)
      env:
        GITHUB_ACTIONS_MATRIX_NAME: ${{ matrix.name }}
        CI_CREDENTIALS: ${{ secrets.CI_CREDENTIALS }}
        CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
      run: uv run --no-project --python ${{ matrix.python }} poetry run inv test-not-integration
    - name: Install Playwright Chromium for Runtime browser acceptance
      working-directory: action_server/frontend
      run: npx playwright install chromium
    - name: Verify Canvas published-Core Runtime and browser acceptance
