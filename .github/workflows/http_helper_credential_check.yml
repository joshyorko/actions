name: HTTP Helper credential availability

on:
  push:
    branches:
      - release/http-helper-credential-check-20261009
    paths:
      - .github/workflows/http_helper_credential_check.yml
permissions: {}

jobs:
  credential-availability:
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 2
    steps:
      - name: Check credential is nonempty without publishing
        shell: bash
        env:
          HELPER_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN_ACTIONS_HTTP_HELPER }}
        run: |
          set +x
          set -euo pipefail
          if [[ -z "${HELPER_PYPI_TOKEN:-}" ]]; then
            echo "HTTP Helper publication credential is unavailable." >&2
            exit 1
          fi
          echo "HTTP Helper credential is nonempty in the pypi environment. No publication or registry authentication was attempted." >> "$GITHUB_STEP_SUMMARY"
