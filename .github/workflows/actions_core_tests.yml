name: Actions Core Tests
permissions:
  contents: read
  id-token: write
'on':
  push:
    branches:
    - community
    - wip
    paths:
    - actions/**
    - .github/workflows/actions_core_tests.yml
    - devutils/**
    - actions-http-helper/**
    - .github/workflows/_gen_workflows.py
  pull_request:
    branches:
    - community
    paths:
    - actions/**
    - .github/workflows/actions_core_tests.yml
    - devutils/**
    - actions-http-helper/**
    - .github/workflows/_gen_workflows.py
defaults:
  run:
    working-directory: ./actions
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name:
        - ubuntu-py3.10-devmode
        - windows-py3.10-devmode
        - macos-py3.10-devmode
        include:
        - name: ubuntu-py3.10-devmode
          python: '3.10'
          os: ubuntu-22.04
        - name: windows-py3.10-devmode
          python: '3.10'
          os: windows-2022
        - name: macos-py3.10-devmode
          os: macos-15
          python: '3.10'
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install Python 3.10
      run: uv python install 3.10
    - name: Install devutils requirements
      run: uv run --no-project --python ${{ matrix.python }}  python -m pip install
        --break-system-packages -r ../devutils/requirements.txt
    - name: Install project (not dev)
      if: contains(matrix.name, '-devmode') == false
      run: uv run --no-project --python ${{ matrix.python }} inv install
    - name: Install project (dev)
      if: contains(matrix.name, '-devmode')
      run: uv run --no-project --python ${{ matrix.python }} inv devinstall
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Test
      env:
        GITHUB_ACTIONS_MATRIX_NAME: ${{ matrix.name }}
        CI_CREDENTIALS: ${{ secrets.CI_CREDENTIALS }}
        CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
        ACTION_SERVER_TEST_ACCESS_CREDENTIALS: ${{ secrets.ACTION_SERVER_TEST_ACCESS_CREDENTIALS
          }}
        ACTION_SERVER_TEST_HOSTNAME: ${{ secrets.ACTION_SERVER_TEST_HOSTNAME }}
      run: uv run --no-project --python ${{ matrix.python }} inv test
    - name: '`inv lint`, potentially fixed with `inv pretty`'
      if: always()
      run: uv run --no-project --python ${{ matrix.python }} inv lint
    - name: '`inv typecheck`'
      if: always()
      run: uv run --no-project --python ${{ matrix.python }} inv typecheck
    - name: '`inv docs` with checking on files changed'
      if: always()
      run: uv run --no-project --python ${{ matrix.python }} inv docs --check
  candidate-wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'
    - name: Install Poetry
      run: pipx install poetry==2.1.1
    - name: Synchronize Core dependencies
      run: poetry sync --no-interaction
    - name: Build Core candidate artifacts
      run: poetry build
    - name: Verify exact Core artifact inventory
      shell: bash
      run: 'set -Eeuo pipefail

        package_version=$(poetry version --short)

        printf ''%s\n'' "actions_core-$package_version-py3-none-any.whl" "actions_core-$package_version.tar.gz"
        | sort > /tmp/core-expected

        find dist -mindepth 1 -maxdepth 1 -printf ''%f\n'' | sort > /tmp/core-actual

        diff -u /tmp/core-expected /tmp/core-actual

        test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2

        test -f "dist/actions_core-$package_version-py3-none-any.whl"

        test ! -L "dist/actions_core-$package_version-py3-none-any.whl"

        test -f "dist/actions_core-$package_version.tar.gz"

        test ! -L "dist/actions_core-$package_version.tar.gz"'
    - name: Install Twine 6.2.0
      run: poetry run python -m pip install twine==6.2.0
    - name: Verify Core candidate artifacts
      run: poetry run twine check --strict dist/*.whl dist/*.tar.gz
    - name: Verify clean installed Core candidate wheel
      shell: bash
      run: 'set -Eeuo pipefail

        wheel="$(find dist -maxdepth 1 -name ''actions_core-*.whl'' -print -quit)"

        test -n "$wheel"

        python scripts/verify_clean_wheel.py "$wheel"'
    - name: Record candidate artifact hashes and provenance
      shell: bash
      run: "set -Eeuo pipefail\nsha256sum dist/*.whl dist/*.tar.gz | sed 's#dist/##'\
        \ | sort > dist/actions-core-manifest.sha256\ntest \"$(git rev-parse HEAD)\"\
        \ = \"$GITHUB_SHA\"\npython - <<'PY'\nimport json, os, subprocess\nsource_sha\
        \ = os.environ['GITHUB_SHA']\nsource_tree = subprocess.check_output(['git',\
        \ 'rev-parse', f'{source_sha}^{{tree}}'], text=True).strip()\nreceipt = {\n\
        \    'source_sha': source_sha,\n    'source_tree': source_tree,\n    'workflow_run_id':\
        \ os.environ['GITHUB_RUN_ID'],\n    'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),\n\
        \    'event_name': os.environ['GITHUB_EVENT_NAME'],\n    'ref': os.environ['GITHUB_REF'],\n\
        }\nwith open('dist/actions-core-candidate-provenance.json', 'w', encoding='utf-8')\
        \ as output:\n    json.dump(receipt, output, indent=2, sort_keys=True)\n \
        \   output.write('\\n')\nPY"
    - name: Upload verified Core candidate artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: actions-core-candidate-dist
        path: actions/dist
        if-no-files-found: error


