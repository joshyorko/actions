name: Frontend canonical integrity

on:
  pull_request:
    paths:
      - 'action_server/frontend/package.json'
      - 'action_server/frontend/package-lock.json'
      - 'action_server/frontend/LICENSE'
      - 'action_server/tests/action_server_tests/test_vendored_integrity.py'
      - '.github/workflows/vendor-integrity-check.yml'
  push:
    branches: [community]
    paths:
      - 'action_server/frontend/package.json'
      - 'action_server/frontend/package-lock.json'
      - 'action_server/frontend/LICENSE'
      - 'action_server/tests/action_server_tests/test_vendored_integrity.py'

jobs:
  check-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify canonical offline contract
        working-directory: action_server
        run: python -m pytest tests/action_server_tests/test_vendored_integrity.py -q --noconftest
