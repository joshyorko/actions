info:
  title: Actions Runtime
  version: <removed-for-compare>
openapi: 3.1.0
paths:
  /:
    get:
      operationId: serve_index__get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Index
  /actions/oauth2:
    get:
      description: 'Callback that should''ve been registered in the OAuth2 callback
        to

        complete the authentication flow.'
      operationId: oauth2_redirect_actions_oauth2_get
      parameters:
      - in: query
        name: state
        required: false
        schema:
          default: ''
          title: State
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Oauth2 Redirect
  /actions/{full_path}:
    get:
      operationId: serve_index_actions__full_path__get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Index
  /analytics:
    get:
      operationId: serve_index_analytics_get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Index
  /api/actionPackages:
    get:
      operationId: list_action_packages_api_actionPackages_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActionPackageApi'
                title: Response List Action Packages Api Actionpackages Get
                type: array
          description: Successful Response
      summary: List Action Packages
  /api/analytics/runs-by-action:
    get:
      description: "Returns run counts grouped by action.\n\nReturns:\n    List of\
        \ RunsByAction objects sorted by total runs descending"
      operationId: get_runs_by_action_api_analytics_runs_by_action_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunsByAction'
                title: Response Get Runs By Action Api Analytics Runs By Action Get
                type: array
          description: Successful Response
      summary: Get Runs By Action
  /api/analytics/runs-by-day:
    get:
      description: "Returns run counts grouped by day.\n\nArgs:\n    days: Number\
        \ of days to look back (default 30)\n\nReturns:\n    List of RunsByDay objects\
        \ sorted by date ascending"
      operationId: get_runs_by_day_api_analytics_runs_by_day_get
      parameters:
      - in: query
        name: days
        required: false
        schema:
          default: 30
          title: Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunsByDay'
                title: Response Get Runs By Day Api Analytics Runs By Day Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Runs By Day
  /api/analytics/summary:
    get:
      description: "Returns summary statistics for all runs.\n\nReturns:\n    AnalyticsSummary\
        \ with total_runs, success_rate, avg_duration_ms, runs_today"
      operationId: get_analytics_summary_api_analytics_summary_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: Successful Response
      summary: Get Analytics Summary
  /api/robots/catalog:
    get:
      description: 'Get catalog of available robot packages.


        Scans configured directories for robot packages (package.yaml with tasks).'
      operationId: get_robot_catalog_api_robots_catalog_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotCatalogResponseAPI'
          description: Successful Response
      summary: Get Robot Catalog
  /api/robots/import:
    post:
      description: 'Import a robot package from a file upload or URL.


        Either ''file'' (a .zip upload) or ''url'' (a URL to download from) must be
        provided.


        The robot package must contain a package.yaml with tasks defined.'
      operationId: import_robot_api_robots_import_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_robot_api_robots_import_post'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotImportResponseAPI'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Import Robot
  /api/robots/run:
    post:
      description: 'Execute a robot task and track its execution.


        The task is executed asynchronously and the run status can be monitored

        via the /api/runs/{run_id} endpoint.'
      operationId: run_robot_task_api_robots_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotRunRequestAPI'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotRunResponseAPI'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run Robot Task
  /api/runs:
    get:
      operationId: list_runs_api_runs_get
      parameters:
      - description: Filter by run type (e.g., 'action', 'robot')
        in: query
        name: run_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by run type (e.g., 'action', 'robot')
          title: Run Type
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunDetailModel'
                title: Response List Runs Api Runs Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Runs
  /api/runs/run-id-from-request-id/{request_id}:
    get:
      description: Returns the run id associated with the request id.
      operationId: run_id_from_request_id_api_runs_run_id_from_request_id__request_id__get
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          title: Request ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunIdFromRequestId'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run Id From Request Id
  /api/runs/summary:
    get:
      operationId: list_run_summaries_api_runs_summary_get
      parameters:
      - description: Filter by run type (e.g., 'action', 'robot')
        in: query
        name: run_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by run type (e.g., 'action', 'robot')
          title: Run Type
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunListItemModel'
                title: Response List Run Summaries Api Runs Summary Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Run Summaries
  /api/runs/{run_id}:
    get:
      operationId: show_run_api_runs__run_id__get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: ID for run
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailModel'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Show Run
  /api/runs/{run_id}/artifacts:
    get:
      operationId: get_run_artifacts_api_runs__run_id__artifacts_get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: ID for run
          type: string
      responses:
        '200':
