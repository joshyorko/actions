name: Preserve Runtime release bundle (no publication)
on:
  push:
    branches: [backup/runtime-release-bundles]
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-release-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'joshyorko/actions' && github.ref == 'refs/heads/backup/runtime-release-bundles'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing release-verifier dependencies
        run: python -m pip install twine==6.2.0 packaging==25.0
      - name: Verify and stage the exact original bytes without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          request = json.loads(Path('scripts/runtime-release-backup-request.json').read_text())
          expected = {'purpose', 'source_run_id', 'source_sha', 'version', 'manifest_sha256'}
          if set(request) != expected:
              raise SystemExit('Unexpected backup request fields')
          subprocess.run([
              sys.executable, 'action_server/scripts/runtime_release_backup.py',
              '--source-sha', request['source_sha'], '--version', request['version'],
              '--manifest-sha256', request['manifest_sha256'],
              '--preparation-run-id', str(request['source_run_id']),
              '--output', str(Path(os.environ['RUNNER_TEMP']) / 'runtime-release-backup'),
          ], check=True)
          PY
      - name: Retain unchanged publication payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-release-bundle-${{ github.run_id }}-1
          path: ${{ runner.temp }}/runtime-release-backup/bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact original ZIP and recovery receipt separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-release-archive-${{ github.run_id }}-1
          path: ${{ runner.temp }}/runtime-release-backup/archive/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
