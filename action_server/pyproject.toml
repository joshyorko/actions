[tool.poetry]
name = "actions-runtime"
version = "1.0.1"
description = """Community Action Server"""
authors = [
	"Sema4.ai, Inc. <dev@sema4.ai>",
	"Fabio Z. <fabio@sema4.ai>"
]
readme = "README.md"
repository = "https://github.com/joshyorko/actions/tree/community"
license = "Apache-2.0"
packages = [{ include = "actions", from = "src" }]
include = [
	"src/actions/server/_static_contents.py",
	"src/actions/server/_oauth2_config.py",
	"src/actions/server/bin/rcc*",
	"src/actions/server/templates/action-templates.zip",
	"src/actions/server/templates/action-templates.yaml",
]
homepage = "https://github.com/joshyorko/actions/tree/community"

[tool.poetry.scripts]
action-server = "actions.server.cli:main"


[tool.poetry.dependencies]
aiohttp = "^3.13.2"
fastapi-slim = "^0.121.1"
jsonschema = "^4.23.0"
# This one needs a `_fix_jsonschema_specifications` hack
# See: https://github.com/python-jsonschema/jsonschema-specifications/issues/61
jsonschema-specifications = "^2024.10.1"
msgspec = "^0.19"
psutil = ">=5.0,<8.0"
pydantic = "^2.12.4"
pyyaml = "^6.0.3"
python = ">=3.12,<3.14"
requests = "^2"
actions-core = "^1.0.0"
actions-http-helper = "^1.0.0"
termcolor = "^3.2.0"
uvicorn = "^0.38.0"
websockets = "^15.0.1"
cryptography = "^46.0.3"
requests_oauthlib = "^2.0"
watchfiles = "^1.1.1"
mcp = "^2.0.0"
actions-work-items = "^0.4.4"
# Scheduling dependencies
croniter = "^2.0.0"
pytz = "^2024.1"
aiosmtplib = "^3.0.0"
# Redis for control-room-lite mode (bundled so it just works)
redis = "^5.0.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
actions-local-devutils = { path = "../devutils/", develop = true }
httpx = "^0.28.1"
types-requests = "^2"
types-PyYAML = "^6"
robocorp-log-pytest = "^0.0.5"
types-psutil = "^7"
types-jsonschema = "^4.22.0"
pyinstaller = "6.16.0"
pyinstaller-hooks-contrib = "2025.9"

[tool.mypy]
mypy_path = "src:tests"

[tool.black]
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.pytest.ini_options]
norecursedirs = "tests/action_server_tests/test_devenv/* dist build build-binary"
testpaths = ["tests"]
markers = [
    "real_rcc: gated real RCC Environment Artifact execution proof",
    "postgresql: requires a PostgreSQL service",
]
filterwarnings = [
    "ignore:ast.Str is deprecated.*:DeprecationWarning:robocorp\\.log\\._ast_utils",
    "ignore:ast.Str is deprecated.*:DeprecationWarning:robocorp\\.log\\._rewrite_ast_add_callbacks",
    "ignore:Attribute s is deprecated.*:DeprecationWarning:robocorp\\.log\\._rewrite_ast_add_callbacks",
]

# This is for backward compatibility.
[[tool.mypy.overrides]]
module = "robocorp.actions.*"
ignore_missing_imports = true

# Ignore missing build system modules (tests for unimplemented features)
[[tool.mypy.overrides]]
module = [
    "tree_shaker",
    "tier_selector",
    "artifact_validator",
    "build_artifact",
    "package_resolver",
    "package_manifest"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "robocorp.tasks.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "actions.server._oauth2_config",
    "actions.server._static_contents",
    "croniter",
    "cronstrue",
    "pytz",
]
ignore_missing_imports = true


[tool.robocorp.log]
default_library_filter_kind = "exclude"
log_filter_rules = [{ name = "sema4ai", kind = "full_log" }]
